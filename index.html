:root{

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;
  background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;
}
header{
  background:var(--accent);color:#fff;padding:12px 20px;
  display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;
}
header h1{font-size:17px;font-weight:700;white-space:nowrap;letter-spacing:.5px}
header .search-wrap{flex:1;max-width:680px;margin:0 auto;display:flex}
header .search-wrap input{
  flex:1;padding:9px 14px;font-size:14px;border:none;outline:none;
  border-radius:3px 0 0 3px;
}
header .search-wrap button{
  background:#fff;color:var(--accent);border:none;padding:0 20px;
  border-radius:0 3px 3px 0;cursor:pointer;font-size:14px;font-weight:600;
}
header .lang{margin-left:auto}
header .lang select{
  background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);
  padding:6px 10px;border-radius:3px;font-size:12px;cursor:pointer;
}
header .lang select option{color:#000}
.container{display:flex;min-height:calc(100vh - 56px);max-width:1400px;margin:0 auto}
nav{
  width:220px;background:#fff;border-right:1px solid var(--border);
  padding:12px 0;flex-shrink:0;overflow-y:auto;
}
nav .cat-title{
  padding:8px 16px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;
}
nav .cat-group{margin-bottom:2px}
nav .cat-toggle{
  display:flex;align-items:center;gap:6px;width:100%;text-align:left;
  padding:9px 16px;background:none;border:none;cursor:pointer;
  color:var(--fg);font-size:13px;font-family:inherit;font-weight:600;
}
nav .cat-toggle:hover{background:var(--accent-light);color:var(--accent)}
nav .cat-toggle .arrow{font-size:10px;transition:transform .15s;width:12px;display:inline-block}
nav .cat-group.open .cat-toggle .arrow{transform:rotate(90deg)}
nav .cat-children{padding-left:0;overflow:hidden}
nav .cat-item{
  display:block;width:100%;text-align:left;padding:7px 16px 7px 32px;
  background:none;border:none;border-left:3px solid transparent;
  color:#444;font-size:12.5px;cursor:pointer;font-family:inherit;
}
nav .cat-item:hover{background:var(--accent-light);color:var(--accent)}
nav .cat-item.active{background:var(--accent-light);border-left-color:var(--accent);color:var(--accent);font-weight:600}
main{flex:1;padding:20px;overflow-x:auto;min-width:0}
h2{font-size:18px;margin-bottom:4px;color:var(--fg)}
.desc{color:var(--muted);font-size:13px;margin-bottom:16px}
/* 卡片網格（首頁/搜尋結果） */
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;
}
.card{
  background:var(--card);border-radius:6px;padding:16px;cursor:pointer;
  border:1px solid var(--border);transition:all .15s;
  display:flex;flex-direction:column;gap:6px;
}
.card:hover{
  border-color:var(--accent);box-shadow:0 2px 8px rgba(30,58,95,.12);
  transform:translateY(-1px);
}
.card .icon{
  width:36px;height:36px;border-radius:6px;background:var(--accent-light);
  color:var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;
}
.card .name{font-size:14px;font-weight:600;color:var(--fg)}
.card .cdesc{font-size:11.5px;color:var(--muted);flex:1}
.card .count{font-size:11px;color:var(--accent);font-weight:600}
/* 表格視圖 */
.table-wrap{background:#fff;border-radius:6px;border:1px solid var(--border);overflow:hidden}
table{
  width:100%;border-collapse:collapse;font-size:12.5px;
}
th,td{
  border-bottom:1px solid var(--border);padding:8px 12px;text-align:left;
  white-space:nowrap;
}
th{background:#fafafa;font-weight:600;color:#555;font-size:12px}
tr:hover td{background:#f0f4f9}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.back-link{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;
  color:var(--accent);cursor:pointer;font-size:13px;background:none;border:none;
  font-family:inherit;padding:0;
}
.back-link:hover{text-decoration:underline}
.note{
  margin-top:12px;padding:10px 14px;background:#fff8e1;border-left:3px solid #f39c12;
  font-size:12px;color:#666;border-radius:0 4px 4px 0;
}
.result-count{font-size:12px;color:var(--muted);margin-bottom:12px}
.search-group{margin-bottom:20px}
.search-group > .grp-title{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
@media(max-width:768px){
  header{flex-wrap:wrap;gap:8px;padding:10px}
  header h1{font-size:14px;width:auto}
  header .search-wrap{order:3;max-width:100%;flex-basis:100%}
  .container{flex-direction:column}
  nav{width:100%;max-height:200px;border-right:none;border-bottom:1px solid var(--border)}
  main{padding:12px}
  .card-grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
</style>

const CAT_ORDER = ["cat_flange","cat_pipe","cat_fitting","cat_fastener","cat_material","cat_valve","cat_electrical","cat_steel","cat_concrete"];
let currentCat = null;
let currentPage = null;
let currentLang = "zh-Hant";
let expanded = new Set();

function t(key){ return I18N[currentLang][key] || I18N["zh-Hant"][key] || key; }
function th(header){ return HEADER_I18N[currentLang]?.[header] || header; }
function itemName(cat){
  if(currentLang==="zh-Hant") return cat.name;
  return ITEM_I18N[cat.id]?.[currentLang] || cat.name;
}

function getItems(catId){ return CATEGORIES.filter(c=>c.cat===catId); }

function renderNav(){
  const nav = document.getElementById("nav");
  let html = "";
  CAT_ORDER.forEach(c=>{
    const open = expanded.has(c);
    html += `<div class="cat-group ${open?'open':''}">`;
    html += `<button class="cat-toggle" data-cat="${c}"><span class="arrow">▶</span>${t(c)}</button>`;
    if(open){
      html += '<div class="cat-children">';
      getItems(c).forEach(item=>{
        html += `<button class="cat-item ${item.id===currentPage?'active':''}" data-id="${item.id}">${itemName(item)}</button>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });
  nav.innerHTML = html;

  nav.querySelectorAll(".cat-toggle").forEach(b=>{
    b.addEventListener("click", ()=>{
      const c = b.dataset.cat;
      if(expanded.has(c)) expanded.delete(c); else expanded.add(c);
      renderNav();
    });
  });
  nav.querySelectorAll(".cat-item").forEach(b=>{
    b.addEventListener("click", ()=>{
      currentPage = b.dataset.id;
      currentCat = CATEGORIES.find(c=>c.id===currentPage).cat;
      renderNav();
      renderPage();
    });
  });
}

function renderTable(headers, rows){
  let html = "<table><thead><tr>";
  headers.forEach(h=>html += `<th>${th(h)}</th>`);
  html += "</tr></thead><tbody>";
  rows.forEach(r=>{
    html += "<tr>";
    r.forEach(cell=>{
      const num = !isNaN(parseFloat(cell)) && isFinite(cell);
      html += `<td class="${num?'num':''}">${cell}</td>`;
    });
    html += "</tr>";
  });
  html += "</tbody></table>";
  return html;
}

function cardHtml(item){
  const d = DATA[item.id];
  const rows = d && d.rows ? d.rows.length : 0;
  const icon = itemName(item).charAt(0);
  return `<div class="card" data-id="${item.id}">
    <div class="icon">${icon}</div>
    <div class="name">${itemName(item)}</div>
    <div class="cdesc">${item.desc}</div>
    <div class="count">${rows} 筆資料</div>
  </div>`;
}

function renderHome(){
  const titleEl = document.getElementById("page-title");
  const descEl = document.getElementById("page-desc");
  const countEl = document.getElementById("result-count");
  const area = document.getElementById("table-area");
  titleEl.textContent = t("browse_all");
  descEl.textContent = t("browse_all_desc");
  countEl.textContent = CATEGORIES.length + (currentLang==="zh-Hant"||currentLang==="zh-Hans" ? " 個資料表" : " tables");
  let html = '<div class="card-grid">';
  CATEGORIES.forEach(item=>{ html += cardHtml(item); });
  html += "</div>";
  area.innerHTML = html;
  area.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("click",()=>{
      currentPage = c.dataset.id;
      currentCat = CATEGORIES.find(x=>x.id===currentPage).cat;
      expanded.add(currentCat);
      renderNav(); renderPage();
    });
  });
}

function renderPage(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const titleEl = document.getElementById("page-title");
  const descEl = document.getElementById("page-desc");
  const countEl = document.getElementById("result-count");
  const area = document.getElementById("table-area");
  document.getElementById("note").textContent = t("note_disclaimer");

  if(q){
    titleEl.textContent = t("search_results");
    descEl.textContent = q;
    // 先列出命中的表卡片，點進去看細節
    const hits = [];
    CATEGORIES.forEach(cat=>{
      const d = DATA[cat.id];
      if(!d || !d.headers) return;
      const matched = d.rows.filter(r => r.join(" ").toLowerCase().includes(q));
      if(matched.length > 0) hits.push({cat, matched});
    });
    let total = hits.reduce((s,h)=>s+h.matched.length,0);
    countEl.textContent = total + (currentLang==="zh-Hant"||currentLang==="zh-Hans" ? " 筆" : " results");
    if(hits.length===0){
      area.innerHTML = '<p style="color:#999;padding:20px">—</p>';
      return;
    }
    let html = '<div class="card-grid">';
    hits.forEach(h=>{
      const d = DATA[h.cat.id];
      const icon = itemName(h.cat).charAt(0);
      html += `<div class="card" data-id="${h.cat.id}">
        <div class="icon">${icon}</div>
        <div class="name">${itemName(h.cat)}</div>
        <div class="cdesc">${h.matched.length} 筆命中</div>
        <div class="count">${d.rows.length} 筆總資料</div>
      </div>`;
    });
    html += "</div>";
    area.innerHTML = html;
    area.querySelectorAll(".card").forEach(c=>{
      c.addEventListener("click",()=>{
        currentPage = c.dataset.id;
        currentCat = CATEGORIES.find(x=>x.id===currentPage).cat;
        expanded.add(currentCat);
        document.getElementById("search").value = "";
        renderNav(); renderPage();
      });
    });
    return;
  }

  if(!currentPage){
    renderHome();
    return;
  }

  const cat = CATEGORIES.find(c=>c.id===currentPage);
  const d = DATA[currentPage];
  if(!d || !d.headers){
    area.innerHTML = "<p style='color:#999;padding:20px'>—</p>";
    return;
  }
  titleEl.textContent = itemName(cat);
  descEl.textContent = cat.desc;
  countEl.textContent = d.rows.length + (currentLang==="zh-Hant"||currentLang==="zh-Hans" ? " 筆" : " rows");
  let back = '<button class="back-link" id="back-btn">← ' + t("back_home") + '</button>';
  area.innerHTML = back + '<div class="table-wrap">' + renderTable(d.headers, d.rows) + '</div>';
  document.getElementById("back-btn").addEventListener("click",()=>{
    currentPage = null; currentCat = null;
    renderNav(); renderPage();
  });
}

document.getElementById("search").addEventListener("input", renderPage);
document.getElementById("search-btn").addEventListener("click", renderPage);
document.getElementById("search").addEventListener("keydown",(e)=>{ if(e.key==="Enter") renderPage(); });

document.getElementById("lang-select").addEventListener("change", (e)=>{
  currentLang = e.target.value;
  document.getElementById("title").textContent = t("title");
  document.getElementById("search").placeholder = t("search");
  renderNav();
  renderPage();
});

renderNav();
renderPage();
</script>
</body>
</html>
